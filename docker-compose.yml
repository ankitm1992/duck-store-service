services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: duckstore
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass1234
    ports:
      - "5455:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d duckstore"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
