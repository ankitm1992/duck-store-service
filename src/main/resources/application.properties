spring.application.name=duck-store-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5455/duckstore}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:pass1234}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
logging.level.org.flywaydb=DEBUG

price.bulk.discount.threshold=100
price.bulk.discount.percent=20
price.wood.packaging.percent=5
price.plastic.packaging.percent=10
price.cardboard.packaging.discount.percent=1
price.sea.shipment=400
price.land.shipment.perUnit =10
price.air.shipment.perUnit=30
price.air.shipment.threshold.unit=1000
price.air.shipment.discount.percent=15

